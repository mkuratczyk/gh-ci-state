version: 2

before:
  hooks:
    # You may remove this if you don't use go modules.
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - freebsd
    goarch:
      - amd64
      - arm64
    # Local artifact basename under dist/
    binary: 'gh-ci-state-{{ .Os }}-{{ .Arch }}{{ if eq .Os "windows" }}.exe{{ end }}'

archives:
  - formats: [binary]
    # gh extension releases: gh-<ext>-<os>-<arch>[.exe] with NO version in the filename.
    # See https://docs.github.com/en/github-cli/github-cli/creating-github-cli-extensions#creating-a-precompiled-extension-manually
    name_template: 'gh-ci-state-{{ .Os }}-{{ .Arch }}{{ if eq .Os "windows" }}.exe{{ end }}'

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
